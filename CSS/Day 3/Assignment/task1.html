<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>React Navbar</title>

  <!-- Font Awesome 6 from cdnjs -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
     /* background: #23272f;  */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .navbar {
      display: flex;
      align-items: center;
      background: #23272f;
      height: 58px;
      padding: 0 20px;
      gap: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    /* ── Logo ── */
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo i {
      font-size: 26px;
      color: #087ea4;
    }

    .logo span {
      font-size: 12px;
      color: #6e7a8a;
      font-weight: 400;
    }

    /* ── Search ── */
    .search {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #2b3040;
      border: 1px solid #3a4155;
      border-radius: 20px;
      height: 36px;
      padding: 0 12px;
      cursor: text;
    }

    .search i {
      font-size: 13px;
      color: #6e7a8a;
    }

    .search span {
      flex: 1;
      font-size: 14px;
      color: #6e7a8a;
    }

    .search .shortcut {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .search kbd {
      background: #1e222c;
      border: 1px solid #3a4155;
      border-radius: 5px;
      font-size: 11px;
      font-family: inherit;
      color: #8c98aa;
      padding: 2px 7px;
    }

    /* ── Nav Links ── */
    .nav-links {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .nav-links a {
      color: #d6dce6;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
    }

    .nav-links a:hover {
      color: #fff;
      background: rgba(255,255,255,0.07);
    }

    /* ── Icon Buttons ── */
    .icons {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #6e7a8a;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 17px;
      transition: color 0.15s, background 0.15s;
    }

    .icon-btn:hover {
      color: #d6dce6;
      background: rgba(255,255,255,0.07);
    }
  </style>
</head>
<body>

<nav class="navbar">

  <!-- Logo: atom icon from Font Awesome -->
  <a class="logo" href="#">
    <i class="fa-solid fa-atom"></i>
    <span>v19.2</span>
  </a>

  <!-- Search bar -->
  <div class="search">
    <i class="fa-solid fa-magnifying-glass"></i>
    <span>Search</span>
    <div class="shortcut">
      <kbd>Ctrl</kbd>
      <kbd>K</kbd>
    </div>
  </div>

  <!-- Nav links -->
  <div class="nav-links">
    <a href="#">Learn</a>
    <a href="#">Reference</a>
    <a href="#">Community</a>
    <a href="#">Blog</a>
  </div>

  <!-- Right icons -->
  <div class="icons">
    <!-- Theme toggle -->
    <button class="icon-btn" title="Toggle theme">
      <i class="fa-solid fa-sun"></i>
    </button>

    <!-- Language -->
    <button class="icon-btn" title="Language">
      <i class="fa-solid fa-earth-americas"></i>
    </button>

    <!-- GitHub -->
    <button class="icon-btn" title="GitHub">
      <i class="fa-brands fa-github"></i>
    </button>
  </div>

</nav>

</body>
</html>
