<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>React</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #23272f;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* TOP GRADIENT BAR */
  .top-bar {
    height: 4px;
    background: linear-gradient(90deg, #149eca 0%, #74c0fc 100%);
    width: 100%;
  }

  /* NAV */
  nav {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    height: 56px;
    background: #23272f;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #149eca;
    font-size: 14px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .nav-logo svg {
    width: 28px;
    height: 28px;
  }

  .nav-version {
    font-size: 11px;
    color: #99a1b3;
    margin-top: 1px;
    font-weight: 400;
  }

  .search-bar {
    flex: 1;
    max-width: 900px;
    margin: 0 16px;
    display: flex;
    align-items: center;
    background: #2b3245;
    border: 1px solid #3d4557;
    border-radius: 20px;
    padding: 6px 12px;
    gap: 8px;
    cursor: text;
    color: #99a1b3;
    font-size: 14px;
  }

  .search-bar svg {
    width: 16px;
    height: 16px;
    opacity: 0.6;
    flex-shrink: 0;
  }

  .search-placeholder {
    flex: 1;
    font-size: 14px;
    color: #99a1b3;
  }

  .kbd-combo {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }

  kbd {
    background: #1a1f2b;
    border: 1px solid #3d4557;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
    font-family: inherit;
    color: #99a1b3;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
  }

  .nav-link {
    color: #ced4da;
    text-decoration: none;
    font-size: 18px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 6px;
    transition: color 0.15s, background 0.15s;
  }

  .nav-link:hover {
    color: #fff;
    background: rgba(255,255,255,0.06);
  }

  .nav-icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #99a1b3;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: color 0.15s, background 0.15s;
  }

  .nav-icon-btn:hover {
    color: #fff;
    background: rgba(255,255,255,0.06);
  }

  .nav-icon-btn svg {
    width: 24px;
    height: 24px;
  }

  /* HERO */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px 120px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  /* Subtle dark radial glow behind logo */
  .hero::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(ellipse at center, rgba(20,158,202,0.07) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    pointer-events: none;
  }

  .react-logo {
    width: 100px;
    height: 100px;
    margin-bottom: 24px;
    animation: spin 20s linear infinite;
    transform-origin: center;
  }


  .hero h1 {
    font-size: clamp(48px, 8vw, 80px);
    font-weight: 800;
    letter-spacing: -1px;
    color: #e4cece;
    margin-bottom: 16px;
    line-height: 1;
  }

  .hero p {
    font-size: clamp(18px, 2.5vw, 23px);
    font-weight: 600;
    color: #ced4da;
    margin-bottom: 36px;
    max-width: 540px;
    line-height: 1.4;
  }

  .cta-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-primary {
    background: #149eca;
    color: #fff;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    padding: 13px 28px;
    border-radius: 100px;
    transition: background 0.18s, transform 0.12s;
    letter-spacing: 0.01em;
  }

  .btn-primary:hover {
    background: #0e8ab5;
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: #343a46;
    color: #fff;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    padding: 13px 28px;
    border-radius: 100px;
    transition: background 0.18s, transform 0.12s;
    letter-spacing: 0.01em;
  }

  .btn-secondary:hover {
    background: #3e4557;
    transform: translateY(-1px);
  }
</style>
</head>
<body>

<div class="top-bar"></div>

<nav>
  <!-- Logo -->
  <a class="nav-logo" href="#">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="50" rx="48" ry="18" stroke="#149eca" stroke-width="5" fill="none"/>
      <ellipse cx="50" cy="50" rx="48" ry="18" stroke="#149eca" stroke-width="5" fill="none" transform="rotate(60 50 50)"/>
      <ellipse cx="50" cy="50" rx="48" ry="18" stroke="#149eca" stroke-width="5" fill="none" transform="rotate(120 50 50)"/>
      <circle cx="50" cy="50" r="7" fill="#149eca"/>
    </svg>
    <span class="nav-version">v19.2</span>
  </a>

  <!-- Search -->
  <div class="search-bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <span class="search-placeholder">Search</span>
    <div class="kbd-combo">
      <kbd>Ctrl</kbd><kbd>K</kbd>
    </div>
  </div>

  <!-- Nav links -->
  <div class="nav-links">
    <a class="nav-link" href="#">Learn</a>
    <a class="nav-link" href="#">Reference</a>
    <a class="nav-link" href="#">Community</a>
    <a class="nav-link" href="#">Blog</a>

    <!-- Sun icon -->
    <button class="nav-icon-btn" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>

    <!-- Language icon -->
    <button class="nav-icon-btn" aria-label="Change language">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    </button>

    <!-- GitHub icon -->
    <button class="nav-icon-btn" aria-label="GitHub">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
    </button>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <svg class="react-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="50" rx="48" ry="18" stroke="#149eca" stroke-width="4" fill="none"/>
    <ellipse cx="50" cy="50" rx="48" ry="18" stroke="#149eca" stroke-width="4" fill="none" transform="rotate(60 50 50)"/>
    <ellipse cx="50" cy="50" rx="48" ry="18" stroke="#149eca" stroke-width="4" fill="none" transform="rotate(120 50 50)"/>
    <circle cx="50" cy="50" r="7" fill="#149eca"/>
  </svg>

  <h1>React</h1>
  <p>The library for web and native user interfaces</p>

  <div class="cta-buttons">
    <a class="btn-primary" href="#">Learn React</a>
    <a class="btn-secondary" href="#">API Reference</a>
  </div>
</section>

</body>
</html>
