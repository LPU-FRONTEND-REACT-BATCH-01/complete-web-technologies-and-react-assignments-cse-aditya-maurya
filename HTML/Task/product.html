<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Goods | Products</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="product.html" class="logo">ModernGoods.</a>
        <div class="nav-links">
            <a href="product.html">Shop</a>
            <a href="cart.html" class="cart-icon">
                <i class="fas fa-shopping-cart"></i> Cart
                <span id="cart-count">0</span>
            </a>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">Featured Products</h1>
        <div id="product-container" class="products-grid">
            <!-- Loading indicator initially visible -->
             <div style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
                 <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--primary-color);"></i>
                 <p style="margin-top: 1rem; color: var(--text-muted);">Loading products...</p>
             </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
